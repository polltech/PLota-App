name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (android or ios)'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
# NOTE: Automatic tag-triggered builds are temporarily disabled to avoid
# running CI on every push while doing UI/content changes locally.
# To re-enable automatic builds, restore the `push` trigger below.
# push:
#   tags:
#     - 'v*'
#     - 'release-*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-manual:
    name: Manual production build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: npm ci
      - name: Build on EAS
        run: |
          if [ "${{ github.event.inputs.platform }}" = "android" ]; then
            eas build --profile apk --platform android --non-interactive
          else
            eas build --profile production --platform ios --non-interactive
          fi
      # Submit to stores is disabled temporarily to avoid automatic submissions
      # during UI/content work. To re-enable, uncomment the block below and
      # ensure CI has the required credentials (Google service account /
      # App Store Connect API key) stored in GitHub Secrets or checked in
      # securely as files referenced by `eas.json`.
      # - name: Submit to stores
      #   run: |
      #     eas submit --platform ${{ github.event.inputs.platform }} --latest --non-interactive || true

  build-auto:
    name: Automatic production build on tag
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: npm ci
      - name: Build on EAS (Android)
        run: eas build --profile apk --platform android --non-interactive
      - name: Build on EAS (iOS)
        run: eas build --profile production --platform ios --non-interactive
      # Submit to stores (disabled)
      # If you want automatic submission on tag push, uncomment and configure
      # the service account / API credentials first.
      # - name: Submit to stores
      #   if: github.event_name == 'push'
      #   run: |
      #     eas submit --platform android --latest --non-interactive || true
      #     eas submit --platform ios --latest --non-interactive || true
